<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050d;--panel:#0e0a18;--panel2:#150f25;--edge:#2b1d4a;--tx:#efe9fb;--mut:#8d82ab;--p:#9b5cff;--p2:#6d28d9;--glow:#c9a6ff}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{color:var(--tx);font:15px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh;
 background:radial-gradient(900px 420px at 50% -120px,#33166e 0,transparent 70%),
 linear-gradient(#ffffff08 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,#ffffff08 1px,transparent 1px) 0 0/32px 32px,var(--bg)}
button,input{font-family:inherit}a{color:inherit;text-decoration:none}
.px{font-family:'Silkscreen','Courier New',monospace;font-weight:700;letter-spacing:.02em}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
nav{background:#08060fee;border-bottom:2px solid var(--edge);position:sticky;top:0;z-index:9;backdrop-filter:blur(6px)}
nav .wrap{display:flex;align-items:center;gap:6px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;margin-right:14px;cursor:pointer}
.brand img{width:34px;height:34px}
.nt{background:none;border:0;color:var(--mut);font-weight:700;font-size:15px;padding:8px 12px;cursor:pointer;border-radius:4px}
.nt:hover{color:var(--tx)}.nt.on{color:#fff;background:var(--panel2);box-shadow:inset 0 -3px 0 var(--p)}
.sp{flex:1}
#q{background:#000;border:2px solid var(--edge);color:var(--tx);padding:8px 12px;width:190px;font-size:14px}
#q:focus{border-color:var(--p);outline:0}
.btn{background:var(--p2);color:#fff;border:0;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;
 box-shadow:inset 2px 2px 0 #ffffff40,inset -2px -2px 0 #00000060,3px 3px 0 #000}
.btn:hover{background:var(--p)}.btn:active{transform:translate(2px,2px)}
.hero{padding:44px 0 8px;text-align:center}
.hero img.big{width:96px;height:96px;filter:drop-shadow(0 0 30px #8b3dffaa)}
.hero h1{font-size:clamp(42px,9vw,80px);line-height:1;margin:10px 0 6px;text-shadow:4px 4px 0 #3b1a7a}
.hero h1 span{color:var(--p)}.hero p{color:var(--mut)}
.chips{display:flex;justify-content:center;gap:12px;margin:22px 0;flex-wrap:wrap}
.chip{background:var(--panel);border:2px solid var(--edge);padding:8px 18px;min-width:120px;box-shadow:3px 3px 0 #000}
.chip b{display:block;font-size:26px;color:var(--glow)}.chip small{color:var(--mut);font-size:12px}
.ipbar{display:flex;justify-content:center;margin:0 auto 30px;max-width:460px}
.ipbar code{flex:1;background:#000;border:2px solid var(--edge);border-right:0;padding:10px 14px;color:var(--glow);font:700 16px 'Silkscreen',monospace;text-align:left;overflow:hidden;text-overflow:ellipsis}
/* kit picker */
.picker{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 14px;margin-bottom:6px;justify-content:center;flex-wrap:wrap}
.kb{background:var(--panel);border:2px solid var(--edge);width:78px;padding:10px 4px 7px;cursor:pointer;color:var(--mut);box-shadow:3px 3px 0 #000;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700}
.kb:hover{border-color:#5b3d99;color:var(--tx)}
.kb.on{background:linear-gradient(#2a1458,#1a0d38);border-color:var(--p);color:#fff;box-shadow:3px 3px 0 #000,0 0 22px #8b3dff66}
.kb.dim{opacity:.5}
.kb svg{image-rendering:pixelated}
@media(max-width:760px){.picker{justify-content:flex-start;flex-wrap:nowrap}.kb{flex:0 0 74px}}
.sec{display:flex;align-items:center;gap:14px;margin:8px 0 18px}
.sec h2{font-size:30px}.sec small{color:var(--mut)}
/* podium */
.podium{display:flex;justify-content:center;gap:12px;align-items:flex-end;margin-bottom:30px}.podium>.pod{flex:1 1 0;max-width:310px}.podium>.pod.p1{flex-grow:1.15}
.pod{background:linear-gradient(#1a1030,#0e0a18);border:2px solid var(--edge);text-align:center;padding:18px 8px 14px;cursor:pointer;box-shadow:4px 4px 0 #000;min-width:0;position:relative}
.pod:hover{border-color:var(--p)}
.pod img{width:64px;height:64px;image-rendering:pixelated;background:#000;border:2px solid #000;box-shadow:0 0 0 2px var(--edge)}
.pod .nm{font-weight:700;margin-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .el{font-size:26px;color:var(--glow);min-height:36px;display:flex;align-items:center;justify-content:center}.pod small{color:var(--mut)}
.pod .pl{position:absolute;top:-2px;left:-2px;background:var(--p2);padding:2px 10px;font-size:16px;box-shadow:2px 2px 0 #000}
.pod.p1{padding-top:28px;padding-bottom:26px;border-color:var(--p);box-shadow:4px 4px 0 #000,0 0 44px #8b3dff66}
.pod.p1 img{width:92px;height:92px}.pod.p1 .el{font-size:34px}
.pod.p1 .pl{background:#d4a017;color:#1a1000}.pod.p2 .pl{background:#9aa0b4;color:#10121a}.pod.p3 .pl{background:#b0703c;color:#190c00}
.box{background:var(--panel);border:2px solid var(--edge);box-shadow:4px 4px 0 #000;margin-bottom:40px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{color:var(--mut);font-size:12px;font-weight:700;text-align:left;padding:10px 14px;background:var(--panel2);white-space:nowrap}
td{padding:9px 14px;border-top:1px solid var(--edge);white-space:nowrap}
tr.r{cursor:pointer}tr.r:hover td{background:#1a1230}
td.n{width:44px;color:var(--mut);font-weight:700}tr.t1 td.n{color:#ffd23f}tr.t2 td.n{color:#cfd3dc}tr.t3 td.n{color:#d08b5b}
.pn{display:flex;align-items:center;gap:10px;font-weight:700}.pn img{width:28px;height:28px;image-rendering:pixelated;background:#000}
.v{color:var(--glow);font-weight:700;text-align:right}th.v{text-align:right}
.tier{display:inline-block;font:700 13px 'Silkscreen',monospace;padding:2px 9px;color:#0a0612;box-shadow:2px 2px 0 #000}
.w{color:#6ee7a0}.l{color:#ff7b95}.m{color:var(--mut)}
.empty{padding:28px;text-align:center;color:var(--mut)}
h2.px{font-size:28px;margin:6px 0 12px}
.pf{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center;padding:34px 0 20px}
.pf>img{width:150px;height:150px;image-rendering:pixelated;border:2px solid var(--edge);background:#000;box-shadow:4px 4px 0 #000,0 0 40px #8b3dff55}
.pf h1{font-size:clamp(34px,7vw,56px);line-height:1}.pf p{color:var(--mut)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;margin-bottom:28px}
.cell{background:var(--panel);border:2px solid var(--edge);padding:10px 14px;box-shadow:3px 3px 0 #000}.cell b{display:block;font-size:26px;color:var(--glow)}.cell small{color:var(--mut)}
.kcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:30px}
.kc{background:var(--panel);border:2px solid var(--edge);padding:12px;display:flex;gap:12px;align-items:center;box-shadow:3px 3px 0 #000}
.kc b{display:block}.kc small{color:var(--mut)}
footer{border-top:2px solid var(--edge);color:var(--mut);text-align:center;padding:22px;font-size:13px}
.live{display:inline-block;width:8px;height:8px;background:#6ee7a0;margin-right:7px}

  last_online:p.online?Date.now():(st.last_online||0),_p:p}});

async function snap(){
 if(_snap&&Date.now()-_snapAt<15000)return _snap;
 if(/PASTE-YOUR|YOUR-ANON/.test(SUPA.anon))throw new Error('SUPA.anon is still the placeholder. Paste your Supabase anon public key at the top of index.html.');
 const r=await fetch(SUPA.url+"/rest/v1/snapshot?id=eq.1&select=data",{headers:{apikey:SUPA.anon,Authorization:"Bearer "+SUPA.anon},cache:"no-store"});
 const body=await r.text();
 if(!r.ok)throw new Error('Supabase HTTP '+r.status+': '+body.slice(0,300));
 let rows;try{rows=JSON.parse(body)}catch(e){throw new Error('Supabase returned non-JSON: '+body.slice(0,200))}
 if(!rows.length)throw new Error('snapshot table has no row with id=1 (the server plugin has not synced yet, or RLS hides it: add a SELECT policy for anon).');
 _snap=adapt(rows[0].data);_snapAt=Date.now();return _snap}

async function kitPg(k){
 const [o,l]=await Promise.all([j('/api/overview'),j('/api/ladders')]),kits=sortKits(l);
 if(k!=='overall'&&!l[k]){app.innerHTML=`<div class="wrap">${pageHead('overall','Ladder not found','There is no kit with that name.','<a class="btn" href="#/">‹ All ladders</a>')}</div>`;return}
 let body;
 if(k==='overall'){const P=o.players.slice(0,50);
  body=podium(P.slice(0,3).map(p=>({uuid:p.uuid,name:p.name,big:p.elo,sub:'ELO'})))+`<div class="box"><table><tr><th>#</th><th>Player</th><th class="v">ELO</th><th class="v">K/D</th><th class="v">Duels W/L</th></tr>${P.map((p,i)=>`<tr class="r t${i+1}" ${goP(p.name)}><td class="n">${i+1}</td><td><div class="pn">${hd(p.uuid)}${esc(p.name)}</div></td><td class="v">${p.elo}</td><td class="v m">${kd(p.kills,p.deaths)}</td><td class="v">${wl(p.duel_wins,p.duel_losses)}</td></tr>`).join('')}</table></div>`}
 else{const R=l[k];body=!R.length?`<div class="box"><div class="empty">Nobody is ranked in ${cap(k)} yet. Be the first!</div></div>`:
  podium(R.slice(0,3).map(p=>({uuid:p.uuid,name:p.name,big:tier(p.rank_index),sub:p.ar+' AR'})))+`<div class="box"><table><tr><th>#</th><th>Player</th><th>Tier</th><th class="v">AR</th><th class="v">W/L</th></tr>${R.map((p,i)=>`<tr class="r t${i+1}" ${goP(p.name)}><td class="n">${i+1}</td><td><div class="pn">${hd(p.uuid)}${esc(p.name)}</div></td><td>${tier(p.rank_index)}</td><td class="v">${p.ar}</td><td class="v">${wl(p.wins,p.losses)}</td></tr>`).join('')}</table></div>`}
 app.innerHTML=`<div class="wrap">${pageHead(k,(k==='overall'?'Overall':cap(k))+' ladder',k==='overall'?'Ranked by ELO.':'Ranked by tier and AR.','<a class="btn" href="#/">‹ All ladders</a>')}${picker(kits,l,k)}${body}</div>`}

 app.innerHTML=`<div class="wrap">${pageHead('sword','Matches','The last 100 duels.')}<div class="box"><table><tr><th>Kit</th><th>Winner</th><th>Loser</th><th class="v">Score</th><th class="v">When</th></tr>${m.map(x=>`<tr class="r"><td><div class="pn">${ico(x.kit,24)}<span class="m" style="font-weight:500">${cap(x.kit)}</span></div></td><td class="w" ${goP(x.winner_name)}><b>${esc(x.winner_name)}</b></td><td class="l" ${goP(x.loser_name)}>${esc(x.loser_name)}</td><td class="v">${x.winner_score} - ${x.loser_score}</td><td class="v m">${ago(x.ended_at)}</td></tr>`).join('')||'<tr><td colspan=5 class="empty">No matches yet</td></tr>'}</table></div></div>`}
async function playerPg(name){
 const [d,o]=await Promise.all([j('/api/player?name='+encodeURIComponent(name)),j('/api/overview')]);
 if(!d){app.innerHTML=`<div class="wrap">${pageHead('overall','Not found','No player called “'+esc(name)+'” has played yet.')}</div>`;return}
 const s=d.stats,kits=[...d.kits].sort((a,b)=>b.rank_index-a.rank_index||b.ar-a.ar);
 const idx=o.players.findIndex(p=>p.uuid===s.uuid),pos=d.rank||(idx>=0?idx+1:null);
 const tileCol=i=>TC[Math.min(i,5)];
 const tiles=kits.map(k=>`<a class="tile" href="#/kit/${encodeURIComponent(k.gamemode)}" title="${esc(cap(k.gamemode))} · ${k.ar} AR" style="border-bottom-color:${tileCol(k.rank_index)}">${ico(k.gamemode,30)}<span style="color:${tileCol(rankIndex(k.rank_index))}">${esc(CFG.ranks[rankIndex(k.rank_index)]||'R'+k.rank_index)}</span></a>`).join('')
  +Array.from({length:Math.max(0,9-kits.length)},()=>'<div class="tile none"></div>').join('');
 const hrs=Math.floor(s.playtime_seconds/3600),mins=Math.floor(s.playtime_seconds%3600/60);
 let seen=NaN;const lo=s.last_online;
 if(typeof lo==='number')seen=lo>1e12?lo:lo*1000;else if(lo)seen=Date.parse(String(lo).replace(' ','T')+(/[zZ]|[+-]\d\d:?\d\d$/.test(String(lo))?'':'Z'));
 const seenTxt=isFinite(seen)?ago(new Date(seen).toISOString().replace('T',' ').slice(0,19)):null;
 const winRate=s.duel_wins+s.duel_losses?Math.round(100*s.duel_wins/(s.duel_wins+s.duel_losses))+'%':'—';
 const duels=d.recent.map(x=>{const w=x.winner_uuid===s.uuid;return `<div class="duel">${ico(x.kit,24)}<span class="res ${w?'w':'l'}">${w?'WIN':'LOSS'}</span><span class="vs">vs ${esc(w?x.loser_name:x.winner_name)} <span class="m">· ${esc(cap(x.kit))}</span></span><span class="m">${ago(x.ended_at)}</span></div>`}).join('')||'<div class="empty sm">No duels yet</div>';
 const title=(k,t,extra)=>`<div class="ptitle">${ico(k,24)}<h2 class="px">${t}</h2>${extra||''}</div>`;
 const cells=[['ELO',s.elo],['Kills',s.kills],['Deaths',s.deaths],['K/D',kd(s.kills,s.deaths)],['Duel wins',s.duel_wins],['Duel losses',s.duel_losses],['Win rate',winRate],['Best streak',s.best_streak]];
 const tabs={
 general:()=>`<div class="pgrid">
  <div class="pcol l"><div class="skinbox"><img src="https://mc-heads.net/body/${encodeURIComponent(s.uuid)}/270" alt="Minecraft skin for ${esc(s.name)}" onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='https://crafatar.com/renders/body/${encodeURIComponent(s.uuid)}?overlay'}else{this.onerror=null;this.style.visibility='hidden'}"></div>
   <div>${title('shield','Badges','<span class="soon">SOON</span>')}<div class="pbox"><div class="badges">${'<i></i>'.repeat(6)}</div></div></div></div>
  <div class="pcol"><div>${title('overall','Rankings')}<div class="pbox"><div class="tiles">${tiles}</div></div></div>
   <div>${title('store','Overall Ranking')}<div class="pbox"><div class="ovr"><b class="px">${pos?'#'+pos:'Unranked'}</b><small>${s.elo} ELO</small>${kits.length?`<span class="pill">${kits.length} ${kits.length===1?'kit':'kits'} ranked</span>`:''}</div>
    <div class="pstats">${[cells[1],cells[2],cells[3],cells[6]].map(c=>`<div class="pstat"><b class="px">${c[1]}</b><small>${c[0]}</small></div>`).join('')}</div></div></div></div>
  <div class="pcol"><div>${title('f_fly','Activity')}<div class="pbox"><div class="status"><span class="${seenTxt==='just now'?'on':''}">${seenTxt==='just now'?'Online':'Offline'}</span></div>
    <div class="arow"><span>Playtime</span><b>${hrs}h ${mins}m</b></div>${seenTxt?`<div class="arow"><span>Last seen</span><b>${seenTxt}</b></div>`:''}<div class="arow"><span>Best streak</span><b>${s.best_streak}</b></div></div></div>
   <div>${title('sword','Recent duels')}<div class="pbox">${duels}</div></div></div></div>`,
 stats:()=>`<div class="cells">${cells.concat([['Playtime',hrs+'h']]).map(c=>`<div class="cell"><b class="px">${c[1]}</b><small>${c[0]}</small></div>`).join('')}</div>
  ${title('overall','Kit tiers')}${kits.length?`<div class="kcards pk2">${kits.map(k=>`<a class="kc" href="#/kit/${encodeURIComponent(k.gamemode)}">${ico(k.gamemode,40)}<div><b>${cap(k.gamemode)}</b>${tier(k.rank_index)} <small>${k.ar} AR · ${k.wins}W ${k.losses}L</small></div></a>`).join('')}</div>`:'<div class="box"><div class="empty">No ranked games yet</div></div>'}`,
 history:()=>`${title('sword','Match history')}<div class="pbox">${duels}</div>`};
 let cur='general';
 const draw=()=>{app.innerHTML=`<div class="wrap pp"><div class="pph"><h1 class="px">${esc(s.name)}${pos?`<small>#${pos} overall</small>`:''}<small>${d.linked?'✓ Discord linked':'Discord not linked'}</small></h1>
  <div class="ptabs" role="tablist">${[['general','General','crown'],['stats','Stats','gem'],['history','Match History','sword']].map(t=>`<button class="ptab ${t[0]===cur?'on':''}" role="tab" aria-selected="${t[0]===cur}" data-t="${t[0]}">${ico(t[2],16)}${t[1]}</button>`).join('')}</div></div>${tabs[cur]()}</div>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{cur=b.dataset.t;draw()})};
 draw()}

const LS={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}},d(k){try{localStorage.removeItem(k)}catch(e){}}};

(()=>{const l=document.querySelector('.brand img');$('#ftlogo').src=l.src;$('#ftdc').href=CFG.discord})();

const FEATS=[['f_elytra','<code>/elytra</code> Get elytra and fireworks to fly around spawn'],['f_party','<code>/party broadcast</code> Broadcast your party so anyone can join'],['f_shield','<code>/shield designs</code> Custom shield designs'],['f_trim','Custom armor trims'],['f_name','Custom named items'],['f_kits','2 extra custom kits'],['f_fly','<code>/fly</code> Fly in spawn']];
const PRODUCTS={
 azur:{name:'Azur+',tagline:'Everything you need to stand out in spawn and in Discord.',dc:'Azur+ in Discord'},
 custom:{name:'Azur+ with custom rank',tagline:'All the Azur+ perks, plus a rank of your own choosing.',dc:'Custom rank in Discord'}};

function storePg(){
 const card=(k,hot)=>{const p=PRODUCTS[k];return `<div class="sc ${hot?'hot':''}">${hot?'<span class="tag px">Your own name</span>':''}
  <h3 class="px">${p.name}</h3><p class="sub">${p.tagline}</p>

  <button class="btn big" data-buy="${k}">Buy ${p.name}</button></div>`};
 app.innerHTML=`<div class="wrap">${pageHead('store','Store','Monthly ranks for AzurPvP. Prices are per month.')}
  <div class="sgrid">${card('azur',false)}${card('custom',true)}</div>
 <div class="same"><b>Both ranks include every perk above.</b> The only difference is the custom rank, which is yours to name. Both are billed monthly: $1.99/month for Azur+ and $2.99/month for Azur+ with custom rank.</div></div>`;
 app.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>checkout(b.dataset.buy))}
function closeMod(){const m=$('#mod');if(m)m.remove()}
function checkout(k){
 const p=PRODUCTS[k];closeMod();
 const m=document.createElement('div');m.className='mod open';m.id='mod';
 m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-label="Checkout"><button class="x" aria-label="Close">×</button>
 <h2 class="px">Buy ${p.name}</h2><small class="m">Rank is applied after payment is confirmed by staff.</small>
 <form id="cf" novalidate>
 <label for="mcn">Minecraft username</label><input id="mcn" maxlength="17" autocomplete="off" placeholder="Steve" value="${esc(LS.g('azur_mc')||'')}">
 ${k==='custom'?`<label for="crn">Custom rank name</label><input id="crn" maxlength="16" autocomplete="off" placeholder="e.g. Legend">`:''}
 <label for="dcn">Discord username</label><input id="dcn" maxlength="40" autocomplete="off" placeholder="yourname" value="${esc(LS.g('azur_dc')||'')}">
 <label for="pay">Payment method</label><select id="pay"><option value="PayPal">PayPal</option><option value="Card">Card</option></select>
 <div class="tot"><span>Total per month</span><b class="px">${money(CFG.prices[k])}/mo</b></div>
 <button class="btn big" type="submit">Place order</button><div class="err" id="ce" role="alert"></div></form></div>`;
 document.body.appendChild(m);
 m.onclick=e=>{if(e.target===m)closeMod()};m.querySelector('.x').onclick=closeMod;
 $('#mcn').focus();
 $('#cf').onsubmit=e=>{e.preventDefault();
  const mc=$('#mcn').value.trim(),cr=$('#crn')?$('#crn').value.trim():'',er=$('#ce'),dc=$('#dcn').value.trim().replace(/^@/,'');
  if(!/^\.?[A-Za-z0-9_]{3,16}$/.test(mc))return er.textContent='Enter a valid Minecraft username (3 to 16 letters, numbers or _).';
  if(k==='custom'&&!/^[A-Za-z0-9 _+\-]{2,16}$/.test(cr))return er.textContent='Rank name must be 2 to 16 characters (letters, numbers, space, _ + -).';
  if(dc.length<2)return er.textContent='Enter your Discord username so staff can find you.';
  LS.s('azur_mc',mc);LS.s('azur_dc',dc);
  const id='AZ-'+Date.now().toString(36).toUpperCase();
  const txt=['AzurPvP order '+id,'Rank: '+p.name+(k==='custom'?' ("'+cr+'")':''),'Price: '+money(CFG.prices[k])+' per month','Minecraft: '+mc,'Discord: @'+dc,'Payment: '+$('#pay').value].join('\n');
  const url=CFG.ticketUrl||CFG.discord;
  const done=(tk)=>{
  m.querySelector('.mbox').innerHTML=`<button class="x" aria-label="Close">×</button><div class="ok"><div class="big2 px">✓</div><h2 class="px">Order created</h2>
   ${tk?`<p class="m">A ticket was opened for you on our Discord. Staff will confirm payment there.</p><div class="row"><a class="btn big" href="${esc(tk)}" target="_blank" rel="noopener" style="text-align:center">Open my ticket</a></div>`
   :`<p class="m">Open a ticket on our Discord and paste this order so staff can complete payment.</p><pre id="ot">${esc(txt)}</pre>
   <div class="row"><button class="btn big" id="cp">Copy order</button><a class="btn big ghost" href="${esc(url)}" target="_blank" rel="noopener" style="text-align:center">Open Discord tickets</a></div>`}</div>`;
  m.querySelector('.x').onclick=closeMod;
  const cp=$('#cp');if(!cp)return;cp.onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>cp.textContent='Copied!').catch(()=>{const r=document.createRange();r.selectNodeContents($('#ot'));const s=getSelection();s.removeAllRanges();s.addRange(r);cp.textContent='Selected. Press Ctrl+C'})};
  cp.click()};
  done('')}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMod()});
async function render(){const[a,b]=hp(),p=a||'home';
 document.querySelectorAll('nav .nt').forEach(x=>x.classList.toggle('on',x.dataset.p===(p==='kit'||p==='player'?'home':p)));
 if(!app.innerHTML)app.innerHTML='<div class="wrap"><p class="empty">Loading…</p></div>';
 try{if(p==='kit')await kitPg(decodeURIComponent(b||'overall'));else if(p==='player')await playerPg(decodeURIComponent(b||''));else if(p==='matches')await matchesPg();else if(p==='store')storePg();else if(p==='rules')rulesPg();else if(p==='privacy')privacyPg();else await home()}
 catch(e){console.error(e);app.innerHTML='<div class="wrap"><p class="empty">Could not load stats.<br><small>'+esc(String(e&&e.message||e))+'</small></p></div>'}}
document.querySelectorAll('nav .nt').forEach(b=>b.onclick=()=>{location.hash='#/'+(b.dataset.p==='home'?'':b.dataset.p)});
